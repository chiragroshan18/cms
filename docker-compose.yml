version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: cms_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Express Backend Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cms_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/cms_db?schema=public"
      JWT_SECRET: "cms_super_secret_jwt_key_2026"
      ADMIN_EMAIL: "admin@cms.com"
      ADMIN_PASSWORD: "123456"
    depends_on:
      - postgres

  # React Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cms_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
